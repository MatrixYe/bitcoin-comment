#panel-content { height: 100%; overflow-y: auto; padding: 24px 32px; }
#panel-title { font-size: 16px; font-weight: 600; color: #ffffff; margin: 0 0 16px 0; line-height: 1.4; }

#panel-details.has-tasks { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #3B3B4B; }
#panel-details h1, #panel-details h2, #panel-details h3 { color: #ffffff; margin: 1.2em 0 0.5em 0; font-weight: 600; }

#panel-details h1 { font-size: 1.3em; }
#panel-details h2 { font-size: 1.15em; }
#panel-details h3 { font-size: 1em; }
#panel-details p { margin: 0.8em 0; }
#panel-details ul, #panel-details ol { margin: 0.8em 0; padding-left: 1.5em; }
#panel-details li { margin: 0.4em 0; }
#panel-details code { font-family: 'SF Mono', Monaco, monospace; font-size: 0.9em; background: #363646; padding: 0.15em 0.4em; border-radius: 3px; }

#panel-details pre code { background: none; padding: 0; }
#panel-details blockquote { border-left: 2px solid #3B3B4B; padding-left: 12px; margin: 1em 0; color: rgba(255, 255, 255, 0.5); }
#panel-details a { color: #3b82f6; text-decoration: none; }
#panel-details a:hover { text-decoration: underline; }
#panel-tasks h3 { font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px; }
.task-item { display: flex; align-items: flex-start; padding: 8px 0; }
.task-checkbox { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 3px; margin-right: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.task-checkbox.done { background: #10b981; border-color: #10b981; }
.task-checkbox.done::after { content: '\2713'; color: white; font-size: 10px; font-weight: bold; }
.task-text { font-size: 14px; color: rgba(255, 255, 255, 0.85); line-height: 1.4; }
.task-text.done { color: rgba(255, 255, 255, 0.5); text-decoration: line-through; }

        (function() {
    const container = document.getElementById('container');
    const panel = document.getElementById('panel');
    const overlay = document.getElementById('overlay');
    const panelTitle = document.getElementById('panel-title');
    const panelDetails = document.getElementById('panel-details');
    const panelTasks = document.getElementById('panel-tasks');
    const panelClose = document.getElementById('panel-close');

    const nodesMap = {};
    nodesData.forEach(node => {
        nodesMap[node.id] = node;
    });

    document.querySelectorAll('.node.interactive').forEach(nodeEl => {
        nodeEl.addEventListener('click', (e) => {
            e.stopPropagation();
            const nodeId = nodeEl.dataset.nodeId;
            const node = nodesMap[nodeId];
            if (node) {
                showPanel(node);
            }
        });
    });

    function renderMarkdown(text) {
        if (!text) return '';

        const lines = text.split('\n');
        let html = [];
        let i = 0;

        while (i < lines.length) {
            const line = lines[i];

            if (/^```/.test(line)) {
                let codeLines = [];
                i++;
                while (i < lines.length && !/^```/.test(lines[i])) {
                    codeLines.push(escapeHtml(lines[i]));
                    i++;
                }
                html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
                i++;
                continue;
            }

            if (/^#{1,6} /.test(line)) {
                const match = line.match(/^(#{1,6}) (.+)$/);
                if (match) {
                    const level = match[1].length;
                    html.push('<h' + level + '>' + formatInline(match[2]) + '</h' + level + '>');
                }
                i++;
                continue;
            }

            if (/^>/.test(line)) {
                let quoteLines = [];
                while (i < lines.length && /^>/.test(lines[i])) {
                    quoteLines.push(lines[i].replace(/^>\s?/, ''));
                    i++;
                }
                html.push('<blockquote>' + formatInline(quoteLines.join(' ')) + '</blockquote>');
                continue;
            }

            if (/^(\s*)[-*]\s/.test(line)) {
                html.push(parseList(lines, i, 'ul'));
                while (i < lines.length && /^(\s*)[-*]\s/.test(lines[i])) i++;
                continue;
            }

            if (/^(\s*)\d+\.\s/.test(line)) {
                html.push(parseList(lines, i, 'ol'));
                while (i < lines.length && /^(\s*)\d+\.\s/.test(lines[i])) i++;
                continue;
            }

            if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
                html.push('<hr>');
                i++;
                continue;
            }

            if (line.trim() === '') {
                i++;
                continue;
            }

            let paraLines = [];
            while (i < lines.length && lines[i].trim() !== '' &&
                   !/^#{1,6} /.test(lines[i]) &&
                   !/^[-*]\s/.test(lines[i].trim()) &&
                   !/^\d+\.\s/.test(lines[i].trim()) &&
                   !/^>/.test(lines[i]) &&
                   !/^```/.test(lines[i]) &&
                   !/^(-{3,}|\*{3,})$/.test(lines[i].trim())) {
                paraLines.push(lines[i]);
                i++;
            }
            if (paraLines.length > 0) {
                html.push('<p>' + formatInline(paraLines.join(' ')) + '</p>');
            }
        }

        return html.join('\n');
    }

    function parseList(lines, startIndex, type) {
        let result = [];
        let i = startIndex;
        let baseIndent = lines[i].match(/^(\s*)/)[1].length;

        while (i < lines.length) {
            const line = lines[i];
            const indentMatch = line.match(/^(\s*)/);
            const indent = indentMatch ? indentMatch[1].length : 0;
            const listMatch = type === 'ul'
                ? line.match(/^(\s*)[-*]\s(.*)$/)
                : line.match(/^(\s*)\d+\.\s(.*)$/);

            if (!listMatch) break;

            if (indent === baseIndent) {
                result.push('<li>' + formatInline(listMatch[2]));

                if (i + 1 < lines.length) {
                    const nextLine = lines[i + 1];
                    const nextIndent = nextLine.match(/^(\s*)/)[1].length;
                    const isNextList = /^(\s*)[-*]\s/.test(nextLine) || /^(\s*)\d+\.\s/.test(nextLine);

                    if (isNextList && nextIndent > baseIndent) {
                        const nestedType = /^(\s*)[-*]\s/.test(nextLine) ? 'ul' : 'ol';
                        const nested = parseList(lines, i + 1, nestedType);
                        result.push(nested);
                        while (i + 1 < lines.length) {
                            const checkLine = lines[i + 1];
                            const checkIndent = checkLine.match(/^(\s*)/)[1].length;
                            const checkIsList = /^(\s*)[-*]\s/.test(checkLine) || /^(\s*)\d+\.\s/.test(checkLine);
                            if (!checkIsList || checkIndent <= baseIndent) break;
                            i++;
                        }
                    }
                }

                result.push('</li>');
            } else if (indent < baseIndent) {
                break;
            }

            i++;
        }

        return '<' + type + '>' + result.join('') + '</' + type + '>';
    }

    function formatInline(text) {
        let result = escapeHtml(text);

        result = result.replace(/`([^`]+)`/g, '<code>$1</code>');
        result = result.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        result = result.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        result = result.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
        result = result.replace(/(?<!_)_([^_]+)_(?!_)/g, '<em>$1</em>');
        result = result.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

        return result;
    }

    function showPanel(node) {
        panelTitle.textContent = node.topic;

        const hasTasks = Array.isArray(node.tasks) && node.tasks.length > 0;

        if (node.details) {
            panelDetails.innerHTML = renderMarkdown(node.details);
            panelDetails.classList.toggle('has-tasks', hasTasks);
        } else {
            panelDetails.innerHTML = '';
            panelDetails.classList.remove('has-tasks');
        }

        if (hasTasks) {
            let tasksHTML = '<h3>Tasks</h3>';
            node.tasks.forEach(task => {
                const doneClass = task.done ? ' done' : '';
                tasksHTML += '<div class="task-item"><div class="task-checkbox' + doneClass + '"></div><span class="task-text' + doneClass + '">' + escapeHtml(task.text) + '</span></div>';
            });
            panelTasks.innerHTML = tasksHTML;
        } else {
            panelTasks.innerHTML = '';
        }

        panel.classList.remove('hidden');
        overlay.classList.remove('hidden');
    }

    function hidePanel() {
        panel.classList.add('hidden');
        overlay.classList.add('hidden');
    }

    panelClose.addEventListener('click', hidePanel);
    overlay.addEventListener('click', hidePanel);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            hidePanel();
        }
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    let isDragging = false;
    let startX, startY, scrollLeft, scrollTop;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node.interactive')) return;
        isDragging = true;
        startX = e.pageX - container.offsetLeft;
        startY = e.pageY - container.offsetTop;
        scrollLeft = container.scrollLeft;
        scrollTop = container.scrollTop;
    });

    container.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - container.offsetLeft;
        const y = e.pageY - container.offsetTop;
        const walkX = (x - startX) * 1.5;
        const walkY = (y - startY) * 1.5;
        container.scrollLeft = scrollLeft - walkX;
        container.scrollTop = scrollTop - walkY;
    });

    container.addEventListener('mouseup', () => {
        isDragging = false;
    });

    container.addEventListener('mouseleave', () => {
        isDragging = false;
    });

    const svg = document.getElementById('mindmap');
    const viewBox = svg.viewBox.baseVal;
    const initialScrollX = Math.max(0, (viewBox.width - window.innerWidth) / 2);
    const initialScrollY = Math.max(0, (viewBox.height - window.innerHeight) / 2);
    container.scrollLeft = initialScrollX;
    container.scrollTop = initialScrollY;
})();
    </script>
